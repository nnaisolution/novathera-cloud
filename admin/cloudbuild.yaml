# Auto-deploy on push to main.
#
# NEXT_PUBLIC_* are inlined into the bundle at BUILD time, not read at runtime.
# They must be passed as build args here — setting them as Cloud Run env vars
# does nothing, and changing one requires a rebuild, not just a new revision.

steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - -t
      - '${_IMAGE}:$SHORT_SHA'
      - -t
      - '${_IMAGE}:latest'
      - --build-arg
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - --build-arg
      - 'NEXT_PUBLIC_BETTER_AUTH_URL=${_API_URL}'
      - --build-arg
      - 'NEXT_PUBLIC_APP_URL=${_APP_URL}'
      - .

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_IMAGE}']

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - nova-thera-admin
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --quiet

substitutions:
  _REGION: northamerica-northeast2
  _IMAGE: northamerica-northeast2-docker.pkg.dev/nova-thera/apps/admin
  _API_URL: https://api.novathera.ca
  _APP_URL: https://portal.novathera.ca

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
